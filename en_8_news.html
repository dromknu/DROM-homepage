<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notices · DROM Lab · KNU</title>
<meta name="description" content="Notices and announcements of the DROM Laboratory.">
<meta property="og:title" content="Notices · DROM Lab · KNU">
<meta property="og:description" content="Notices and announcements of the DROM Laboratory.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="drom_logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#fff;}body{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;}</style>
</head>
<body>
<section class="dl-root" id="dl-news">
  <style>
    .dl-root{--navy:#0d2440;--blue:#b02419;--teal:#d5241a;--accent:#d5241a;--accent2:#eaa79e;
      --ink:#141b24;--muted:#5a6472;--line:#e5e9f0;--bg:#f4f7fb;--card:#fff;
      color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;
      line-height:1.62;-webkit-font-smoothing:antialiased;word-break:keep-all;font-size:17px;max-width:1080px;margin:0 auto;padding:0 22px 60px;box-sizing:border-box;}
    .dl-root *{box-sizing:border-box;}
    .dl-root h1,.dl-root h2,.dl-root h3,.dl-root h4,.dl-root h5,.dl-root p,.dl-root ul{margin:0;}
    .dl-root a{color:var(--blue);text-decoration:none;}.dl-root a:hover{text-decoration:underline;}
    .dl-lang{display:flex;justify-content:flex-end;gap:6px;margin-top:16px;font-size:13.5px;font-weight:700;}
    .dl-lang a{padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);}
    .dl-lang a.on{background:var(--navy);color:#fff;border-color:var(--navy);}
    .dl-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:16px;flex-wrap:wrap;}
    .dl-logo{height:46px;width:auto;display:block;}
    .dl-top .dl-lang{margin-top:0;}
    .dl-hero{position:relative;overflow:hidden;border-radius:20px;margin-top:12px;
      background:linear-gradient(115deg,#0d2440 0%,#5a2233 55%,#d5241a 135%);color:#fff;padding:44px 46px;}
    .dl-hero::after{content:"";position:absolute;right:-70px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(213,36,26,.20),transparent 68%);}
    .dl-eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:13px;letter-spacing:.14em;font-weight:700;color:var(--accent2);text-transform:uppercase;margin-bottom:14px;}
    .dl-eyebrow::before{content:"";width:28px;height:2px;background:var(--accent);}
    .dl-hero h1{font-size:clamp(30px,4vw,44px);font-weight:800;letter-spacing:-.02em;}
    .dl-hero p.lead{margin-top:14px;max-width:640px;font-size:16px;color:#d8e4f0;}
    .dl-metrics{display:flex;gap:26px;flex-wrap:wrap;margin-top:20px;}
    .dl-metrics div{display:flex;flex-direction:column;}
    .dl-metrics b{font-size:26px;font-weight:800;color:#fff;line-height:1;}
    .dl-metrics span{font-size:12.5px;color:var(--accent2);font-weight:700;margin-top:5px;letter-spacing:.03em;}
    .dl-sec{margin-top:38px;}
    .dl-sechead{display:flex;align-items:center;gap:13px;margin-bottom:18px;}
    .dl-sechead .bar{width:6px;height:24px;border-radius:3px;background:linear-gradient(var(--teal),var(--blue));}
    .dl-sechead h2{font-size:23px;font-weight:800;}
    .dl-sechead .enl{margin-left:auto;font-size:14px;font-weight:600;color:var(--muted);}
    .dl-scholar{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;background:linear-gradient(150deg,var(--navy),#123a63);color:#fff;border-radius:18px;padding:28px 32px;}
    .dl-scholar .firm{font-size:12.5px;color:var(--accent2);font-weight:700;letter-spacing:.1em;margin-bottom:8px;}
    .dl-scholar h3{font-size:20px;font-weight:800;color:#fff;}
    .dl-scholar p{margin-top:7px;font-size:15px;color:#d7e4f1;max-width:560px;}
    .dl-scholar a.btn{background:#fff;color:var(--navy);font-weight:800;font-size:15px;padding:14px 26px;border-radius:11px;white-space:nowrap;}
    .dl-scholar a.btn:hover{text-decoration:none;}
    .dl-pubs{list-style:none;padding:8px 26px;background:var(--card);border:1px solid var(--line);border-radius:16px;}
    .dl-pub{display:grid;grid-template-columns:64px 1fr;gap:18px;padding:16px 0;border-top:1px solid var(--line);}
    .dl-pub:first-child{border-top:none;}
    .dl-yr{font-weight:800;color:var(--teal);font-size:17px;}
    .dl-pub .t{font-weight:700;font-size:16px;}.dl-pub .m{font-size:14px;color:var(--muted);margin-top:4px;}
    .dl-badge{display:inline-block;background:#fbe9e6;color:var(--teal);border-radius:6px;padding:2px 9px;font-weight:800;font-size:12px;margin-right:7px;}
    .dl-note{margin-top:14px;font-size:13.5px;color:var(--muted);}
    .dl-empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:48px 30px;text-align:center;color:var(--muted);}
    .dl-empty b{display:block;font-size:16px;color:var(--ink);font-weight:800;margin-bottom:6px;}
    .dl-cta{margin-top:44px;background:linear-gradient(120deg,var(--blue),var(--navy));color:#fff;border-radius:18px;padding:30px 34px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;}
    .dl-cta h3{font-size:21px;font-weight:800;color:#fff;}.dl-cta p{margin-top:7px;font-size:15px;color:#d7e4f1;}
    .dl-cbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;}
    .dl-btn{background:#fff;color:var(--navy);font-weight:800;font-size:15px;padding:12px 20px;border-radius:11px;white-space:nowrap;}
    .dl-btn.ghost{background:transparent;color:#fff;border:1.6px solid rgba(255,255,255,.55);}
    @media (max-width:840px){.dl-root{font-size:16px;}.dl-hero{padding:34px 24px;}.dl-scholar{flex-direction:column;align-items:flex-start;}
      .dl-cta{grid-template-columns:1fr;}.dl-cbtns{justify-content:flex-start;}.dl-sechead .enl{display:none;}}
  </style>

  <div class="dl-top">
    <a href="en_1_main.html"><img class="dl-logo" src="drom_logo.svg" alt="DROM Lab · 노외기계설계 및 신뢰성평가 연구실"></a>
    <div class="dl-lang"><a href="ko_8_news.html">KO</a><a class="on" href="#">EN</a></div>
  </div>
  <div class="dl-hero">
    <span class="dl-eyebrow">DROM Lab · Notices</span>
    <h1>Notices</h1>
    <p class="lead">Lab news, recruitment, and announcements.</p>
  </div>
  <div class="dl-sec">
    <!-- 공지가 생기면 아래 형식으로 목록을 만들고, 그 아래 dl-empty 블록은 지우세요:
    <div class="dl-newshead"><span>Title</span><span>Date</span></div>
    <ul class="dl-newslist">
      <li><span class="nt">공지 제목</span><span class="nd">2026-07-23</span></li>
    </ul>
    -->
    <div class="dl-empty"><b>No notices yet.</b>New announcements will appear here.</div>
  </div>
  <div class="dl-cta">
    <div><h3>Join the Lab</h3><p>We continuously welcome students interested in off-road/fluid machinery and AI research.</p></div>
    <div class="dl-cbtns">
      <a class="dl-btn" href="https://drom.knu.ac.kr/" target="_blank" rel="noopener">Lab Home</a>
      <a class="dl-btn ghost" href="en_5_students.html">Members</a>
    </div>
  </div>
</section>
</body>
</html>
